name: CI Pipeline

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the three lab tests
        run: python -m pytest -v -k "test_1 or test_2 or test_3"

      - name: Run all automated tests
        if: ${{ !cancelled() }}
        run: python -m pytest -v

      - name: Send test report to my laptop
        if: ${{ !cancelled() }}
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python send_report.py

      - name: Upload report as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: pytest-results.json