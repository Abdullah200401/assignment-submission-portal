name: CI Pipeline

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ───────────────────────── JOB 1: TEST & REPORT ─────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all automated tests
        id: run_tests
        continue-on-error: true
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Start internal report receiver (Runner self-test)
        run: |
          nohup python receiver.py > receiver.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:5001/ || true

      - name: Send test report to internal receiver
        run: python send_report.py http://127.0.0.1:5001/report

      - name: Send test report to External/Local Receiver (via Tunnel / Webhook Secret if set)
        if: env.EXTERNAL_RECEIVER_URL != ''
        env:
          EXTERNAL_RECEIVER_URL: ${{ secrets.LOCAL_RECEIVER_URL }}
        run: |
          python send_report.py "$EXTERNAL_RECEIVER_URL" || true

      - name: Display testreport.json in CI logs
        run: |
          if [ -f testreport.json ]; then
            cat testreport.json
          fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            testreport.json
            test-report.json
            reports.json
            receiver.log
            test-results.xml

      - name: Fail step if tests actually failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Automated tests failed. Propagating failure status."
          exit 1

  # ──────────── JOB 2: DEPLOY TO GITHUB PAGES (BONUS) ────────────
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ──────────── JOB 3: EMAIL TEST REPORT (BONUS) ────────────
  email-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-report

      - name: Generate email report
        id: report
        run: python generate_email_report.py test-results.xml

      - name: Send email report
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.report.outputs.subject_emoji }} ${{ steps.report.outputs.status }} — CI Report (${{ steps.report.outputs.passed }}/${{ steps.report.outputs.total }} passed) @ ${{ github.sha }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "CI Pipeline <${{ secrets.EMAIL_USERNAME }}>"
          html_body: file://email-report.html
          attachments: test-results.xml
          convert_markdown: false
